<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a6644"/>
      <stop offset="100%" stop-color="#3DAA7A"/>
    </linearGradient>
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f5ef"/>
    </linearGradient>
    <linearGradient id="steam1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="rgba(0,0,0,0.22)"/>
    </filter>
    <filter id="inner-glow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="rgba(61,170,122,0.3)"/>
    </filter>
    <clipPath id="round">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- 앱 아이콘 배경 (둥근 사각형) -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- 배경 원형 장식 -->
  <circle cx="430" cy="80" r="180" fill="rgba(255,255,255,0.07)" clip-path="url(#round)"/>
  <circle cx="80" cy="430" r="160" fill="rgba(255,255,255,0.05)" clip-path="url(#round)"/>

  <!-- 큰 접시 (타원 그림자) -->
  <ellipse cx="256" cy="338" rx="148" ry="18" fill="rgba(0,0,0,0.18)"/>

  <!-- 접시 -->
  <ellipse cx="256" cy="310" rx="155" ry="24" fill="rgba(255,255,255,0.25)"/>
  <ellipse cx="256" cy="305" rx="148" ry="20" fill="url(#plate)" filter="url(#shadow)"/>

  <!-- 뚝배기/그릇 몸통 -->
  <path d="M 128 230 Q 120 305 256 318 Q 392 305 384 230 Z"
        fill="url(#plate)" filter="url(#shadow)"/>

  <!-- 그릇 내부 (국물/음식) -->
  <path d="M 148 232 Q 142 295 256 306 Q 370 295 364 232 Z"
        fill="#c8eedc"/>

  <!-- 국물 반짝임 -->
  <ellipse cx="210" cy="258" rx="28" ry="8" fill="rgba(255,255,255,0.5)" transform="rotate(-15,210,258)"/>
  <ellipse cx="300" cy="272" rx="16" ry="5" fill="rgba(255,255,255,0.35)" transform="rotate(10,300,272)"/>

  <!-- 음식 재료들 (동그란 야채/고기) -->
  <circle cx="220" cy="275" r="22" fill="#ff8c42" opacity="0.9"/>
  <circle cx="220" cy="275" r="16" fill="#ffab6e"/>
  <circle cx="260" cy="265" r="18" fill="#6dbf67" opacity="0.9"/>
  <circle cx="295" cy="278" r="20" fill="#e05a5a" opacity="0.85"/>
  <circle cx="295" cy="278" r="14" fill="#ee8080"/>
  <circle cx="248" cy="288" r="13" fill="#f0c040" opacity="0.9"/>

  <!-- 젓가락 -->
  <rect x="330" y="170" width="8" height="145" rx="4" fill="#c8a96e" transform="rotate(12,330,170)"/>
  <rect x="350" y="165" width="8" height="148" rx="4" fill="#b8935a" transform="rotate(8,350,165)"/>

  <!-- 숟가락 -->
  <ellipse cx="168" cy="215" rx="14" ry="19" fill="#d4d4d4" transform="rotate(-15,168,215)"/>
  <ellipse cx="168" cy="215" rx="10" ry="14" fill="#eeeeee" transform="rotate(-15,168,215)"/>
  <rect x="162" y="228" width="8" height="100" rx="4" fill="#d0d0d0" transform="rotate(-15,162,228)"/>

  <!-- 뚝배기 손잡이 왼쪽 -->
  <rect x="100" y="240" width="36" height="20" rx="10" fill="#8B6914" filter="url(#shadow)"/>
  <!-- 뚝배기 손잡이 오른쪽 -->
  <rect x="376" y="240" width="36" height="20" rx="10" fill="#8B6914" filter="url(#shadow)"/>

  <!-- 김 (수증기) -->
  <path d="M 210 195 Q 205 178 212 162 Q 219 146 214 130"
        stroke="url(#steam1)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 256 188 Q 250 170 258 154 Q 266 138 260 120"
        stroke="url(#steam1)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M 302 193 Q 297 176 304 160 Q 311 144 306 128"
        stroke="url(#steam1)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.65"/>

  <!-- 하단 GK 텍스트 -->
  <text x="256" y="390" font-family="Arial Black, sans-serif" font-size="38" font-weight="900"
        fill="rgba(255,255,255,0.95)" text-anchor="middle" letter-spacing="2">경기케어</text>

  <!-- 하단 선 장식 -->
  <rect x="176" y="408" width="160" height="3" rx="1.5" fill="rgba(255,255,255,0.35)"/>

  <!-- MENU 텍스트 -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="700"
        fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="5">MENU</text>
</svg>
