name: 엑셀 자동 다운로드

on:
  schedule:
    - cron: '0 8 8,18,27 * *'  # 매월 8, 18, 27일 오후 5시 KST (08:00 UTC)
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/trigger']

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install

      - name: Playwright Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 엑셀 다운로드
        run: node download-excel.js

      - name: 엑셀파일 확인
        run: ls -la 엑셀파일저장/

      - name: 엑셀 파싱 → menu.json
        run: node parse-menu.js

      - name: 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 엑셀파일저장/ menu.json
          git diff --cached --quiet || git commit -m "chore: $(date +%Y%m%d) 엑셀파일 자동 다운로드 [skip ci]"
          git push

      - name: 텔레그램 완료 알림
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ 경기케어 식단 엑셀 다운로드 완료! ($(date '+%Y-%m-%d %H:%M') KST)"

      - name: 텔레그램 실패 알림
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ 경기케어 식단 엑셀 다운로드 실패! GitHub Actions 로그를 확인하세요."
