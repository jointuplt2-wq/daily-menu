name: 텔레그램 식단 알림

on:
  schedule:
    - cron: '0 22 9,19 * *'     # 매월 10,20일 아침 07:00 KST (전날 22:00 UTC)
    - cron: '0 3 10,20 * *'     # 매월 10,20일 점심 12:00 KST
    - cron: '30 8 10,20 * *'    # 매월 10,20일 저녁 17:30 KST
    - cron: '0 22 27-30 * *'    # 매월 마지막 날 아침 07:00 KST (전날 22:00 UTC, 조건 확인)
    - cron: '0 3 28-31 * *'     # 매월 마지막 날 점심 12:00 KST (조건 확인)
    - cron: '30 8 28-31 * *'    # 매월 마지막 날 저녁 17:30 KST (조건 확인)
  workflow_dispatch:
    inputs:
      meal:
        description: '알림 보낼 식사 (아침/점심/저녁)'
        required: true
        default: '점심'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 마지막 날 여부 확인
        id: check
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          SHOULD_RUN=true

          if [[ "$SCHEDULE" == "0 22 27-30 * *" ]]; then
            # 전날 22:00 UTC에 실행 → 내일(UTC)이 마지막 날인지 = 모레가 1일인지 확인
            AFTER_TOMORROW=$(date -u -d '+2 days' +%d)
            [ "$AFTER_TOMORROW" = "01" ] || SHOULD_RUN=false
          elif [[ "$SCHEDULE" == "0 3 28-31 * *" || "$SCHEDULE" == "30 8 28-31 * *" ]]; then
            # 당일 UTC에 실행 → 오늘(UTC)이 마지막 날인지 = 내일이 1일인지 확인
            TOMORROW=$(date -u -d '+1 day' +%d)
            [ "$TOMORROW" = "01" ] || SHOULD_RUN=false
          fi

          echo "should-run=$SHOULD_RUN" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.check.outputs.should-run == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.should-run == 'true'
        with:
          node-version: '20'

      - name: 의존성 설치
        if: steps.check.outputs.should-run == 'true'
        run: npm install

      - name: 식사 시간 결정
        if: steps.check.outputs.should-run == 'true'
        id: meal
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "meal=${{ github.event.inputs.meal }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(TZ=Asia/Seoul date +%H)
            if [ "$HOUR" -lt 10 ]; then
              echo "meal=아침" >> $GITHUB_OUTPUT
            elif [ "$HOUR" -lt 15 ]; then
              echo "meal=점심" >> $GITHUB_OUTPUT
            else
              echo "meal=저녁" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 텔레그램 알림 발송
        if: steps.check.outputs.should-run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEAL: ${{ steps.meal.outputs.meal }}
        run: node send-notify.js
