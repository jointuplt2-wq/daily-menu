<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
:root{
  --g1:#2E8C63;--g2:#3DAA7A;--g3:#55C896;
  --mint:#E8F7F1;--bg:#F2F7F5;
  --t1:#2C3E35;--t2:#7A9088;--t3:#C5D8D0;--t4:#EDF4F1;
  --sat:env(safe-area-inset-top);
  --sab:env(safe-area-inset-bottom);
  --sal:env(safe-area-inset-left);
  --sar:env(safe-area-inset-right);
}
html{height:100%}
body{
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg);
  min-height:100%;
  overflow-y:auto;
  overscroll-behavior-y:none;
  -webkit-overflow-scrolling:touch;
  -webkit-font-smoothing:antialiased;
  padding-top:var(--sat);
  padding-bottom:calc(80px + var(--sab));
  padding-left:var(--sal);
  padding-right:var(--sar);
}
button,input{touch-action:manipulation;-webkit-appearance:none;user-select:none}
textarea{font-size:16px!important;-webkit-overflow-scrolling:touch}

/* HEADER */
.hdr{background:linear-gradient(145deg,var(--g1),var(--g2),var(--g3));padding:18px 20px 44px;text-align:center;position:relative;overflow:hidden}
.hdr::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:32px;background:var(--bg);border-radius:40px 40px 0 0}
.hdr-bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hdr-bubble.a{width:260px;height:260px;top:-80px;left:-60px}
.hdr-bubble.b{width:180px;height:180px;top:10px;right:-50px}
.brand{display:inline-block;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:.65rem;font-weight:800;padding:3px 12px;border-radius:20px;letter-spacing:.1em;margin-bottom:8px;position:relative;z-index:1}
.hdr h1{font-size:2rem;font-weight:900;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.15);position:relative;z-index:1;line-height:1.2}
.hdr h1 small{display:block;font-size:1rem;font-weight:700;opacity:.9;margin-top:4px;letter-spacing:.04em;padding-left:2.2rem}
.today-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 18px;border-radius:20px;font-size:.82rem;font-weight:600;margin-top:14px;position:relative;z-index:1}

/* MAIN */
.main{padding:14px 14px 10px}

/* EMPTY */
.empty{background:#fff;border-radius:24px;padding:50px 24px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.05)}
.empty .ei{font-size:3.2rem;margin-bottom:14px}
.empty p{color:var(--t2);font-size:.9rem;line-height:1.7}

/* DATE NAVIGATOR */
.date-nav{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px}
.nav-arrow{flex-shrink:0;width:56px;height:56px;border:none;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.12);font-size:2rem;font-weight:700;color:var(--g1);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;-webkit-user-select:none;user-select:none}
.nav-arrow:active{transform:scale(.88);background:var(--mint)}
.nav-arrow:disabled{color:var(--t3);box-shadow:none;background:var(--t4)}
.date-center{width:140px;flex-shrink:0;background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:18px;padding:12px 10px 10px;text-align:center;box-shadow:0 4px 18px rgba(61,170,122,.35)}
.dc-lbl{font-size:.65rem;font-weight:800;color:rgba(255,255,255,.8);margin-bottom:3px;letter-spacing:.06em}
.dc-num{font-size:2.4rem;font-weight:900;color:#fff;line-height:1;letter-spacing:-2px}
.dc-day{font-size:.63rem;font-weight:600;color:rgba(255,255,255,.75);margin-top:3px}

/* MEAL BUTTONS */
.meal-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.mbtn{background:var(--t4);border:2.5px solid transparent;border-radius:16px;padding:13px 8px;text-align:center;cursor:pointer;transition:all .18s;-webkit-user-select:none;user-select:none}
.mbtn.active{border-color:var(--g2);background:var(--mint)}
.mbtn:active{transform:scale(.93)}
.mbtn-icon{font-size:1.6rem;display:block;margin-bottom:5px}
.mbtn-lbl{font-size:.8rem;font-weight:700;color:var(--t1)}
.mbtn.active .mbtn-lbl{color:var(--g1)}

/* MENU PANEL */
.menu-panel{display:none}
.menu-panel.on{display:block}
.menu-ttl{font-size:.78rem;font-weight:800;color:var(--g1);padding-bottom:8px;margin-bottom:11px;border-bottom:1.5px solid var(--mint)}
.menu-body{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mitem{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:11px 12px;min-height:48px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.mitem-em{font-size:1.4rem;flex-shrink:0}
.mitem-nm{font-size:.88rem;font-weight:600;color:var(--t1);word-break:keep-all;line-height:1.3}
.menu-none{text-align:center;padding:28px;color:var(--t2);font-size:.88rem;background:#fff;border-radius:16px}

/* ADMIN FAB */
.admin-fab{position:fixed;bottom:calc(18px + var(--sab));right:calc(16px + var(--sar));z-index:50}
.admin-fab button{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--t3);border-radius:20px;color:var(--t2);font-size:.65rem;font-weight:700;cursor:pointer;padding:10px 16px;min-height:44px;box-shadow:0 2px 10px rgba(0,0,0,.1)}

/* NOTIF FAB */
.notif-fab{position:fixed;bottom:calc(18px + var(--sab));left:calc(16px + var(--sal));z-index:50}
.notif-fab button{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--t3);border-radius:20px;color:var(--t2);font-size:.65rem;font-weight:700;cursor:pointer;padding:10px 16px;min-height:44px;box-shadow:0 2px 10px rgba(0,0,0,.1);transition:all .2s}
.notif-fab button.on{background:var(--mint);color:var(--g1);border-color:var(--g2)}

/* OVERLAY */
.ov{position:fixed;inset:0;background:rgba(20,40,32,.5);z-index:100;display:none;align-items:center;justify-content:center;pointer-events:none}
.ov.on{display:flex}
.ov .pw-box{pointer-events:auto}

/* PASSWORD MODAL */
.pw-box{background:#fff;border-radius:24px;padding:26px 20px 20px;width:84%;max-width:280px;text-align:center}
.pw-lock{font-size:2.2rem;margin-bottom:10px}
.pw-title{font-size:1rem;font-weight:800;color:var(--t1);margin-bottom:3px}
.pw-sub{font-size:.74rem;color:var(--t2);margin-bottom:16px}
.pw-dots{display:flex;justify-content:center;gap:11px;margin-bottom:6px}
.dot{width:12px;height:12px;border-radius:50%;background:#eee;transition:background .15s,transform .15s}
.dot.on{background:var(--g2);transform:scale(1.2)}
.pw-err{font-size:.72rem;color:#ef4444;min-height:16px;margin-bottom:10px}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.npbtn{background:var(--t4);border:none;border-radius:12px;padding:14px 8px;font-size:1.05rem;font-weight:700;color:var(--t1);cursor:pointer;transition:all .1s;min-height:50px}
.npbtn:active{background:var(--g2);color:#fff;transform:scale(.92)}
.npbtn.del{background:#fee2e2;color:#ef4444}
.npbtn.emp{background:transparent;pointer-events:none}
.pw-cancel{background:var(--t4);border:none;border-radius:12px;padding:12px;width:100%;font-size:.88rem;font-weight:600;color:var(--t2);cursor:pointer}

/* ADMIN PANEL */
.admin-panel{position:fixed;inset:0;background:var(--bg);z-index:300;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.admin-panel.on{display:block}
.ap-inner{max-width:520px;margin:0 auto;padding:calc(16px + var(--sat)) 16px calc(60px + var(--sab))}
.ap-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;padding-top:8px}
.ap-head h2{font-size:1.2rem;font-weight:800;color:var(--t1)}
.ap-close{width:34px;height:34px;border-radius:50%;background:var(--t3);border:none;font-size:.9rem;font-weight:700;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.sec-lbl{font-size:.7rem;font-weight:800;color:var(--t2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.upload-box{display:block;background:#fff;border:2px dashed var(--t3);border-radius:20px;padding:34px 20px;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:14px;-webkit-user-select:none;user-select:none}
.upload-box:hover{border-color:var(--g2)}
.ub-icon{font-size:2.4rem;margin-bottom:8px}
.ub-lbl{color:var(--t2);font-size:.9rem}
.ub-hint{color:var(--t3);font-size:.72rem;margin-top:4px}
.status-bar{border-radius:14px;padding:12px 16px;font-size:.83rem;font-weight:600;margin-bottom:12px;display:none;line-height:1.5}
.status-bar.show{display:block}
.status-bar.ok{background:#d1fae5;color:#065f46}
.status-bar.err{background:#fee2e2;color:#991b1b}
.status-bar.info{background:#eff6ff;color:#1d4ed8}
.raw-hint{font-size:.75rem;color:var(--t2);margin-bottom:7px;line-height:1.55}
.raw-area{width:100%;background:#fff;border:1px solid var(--t3);border-radius:14px;padding:13px 15px;font-size:.78rem;font-family:monospace;color:var(--t1);min-height:160px;resize:vertical;outline:none;line-height:1.65;margin-bottom:12px}
.raw-area:focus{border-color:var(--g2)}
.abtn{width:100%;padding:14px;border:none;border-radius:14px;font-size:.93rem;font-weight:700;cursor:pointer;margin-bottom:8px;transition:opacity .15s}
.abtn:active{opacity:.88}
.abtn.pri{background:linear-gradient(135deg,var(--g1),var(--g3));color:#fff;box-shadow:0 4px 14px rgba(61,170,122,.32)}
.abtn.sec{background:var(--t4);color:var(--t2)}
.abtn.dan{background:#fee2e2;color:#ef4444}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(29,78,216,.25);border-top-color:#1d4ed8;border-radius:50%;animation:rot .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes rot{to{transform:rotate(360deg)}}

/* SAVE POPUP */
.sp-wrap{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:99999;display:flex;align-items:center;justify-content:center}
.sp-box{background:#fff;border-radius:26px;padding:34px 26px 24px;width:82%;max-width:280px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.22);animation:spIn .3s ease}
@keyframes spIn{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
.sp-icon{font-size:3rem;margin-bottom:10px;display:block}
.sp-ttl{font-size:1.05rem;font-weight:900;color:var(--t1);margin-bottom:8px}
.sp-msg{font-size:.83rem;color:var(--t2);line-height:1.65;margin-bottom:22px;white-space:pre-line}
.sp-btn{width:100%;padding:13px;border:none;border-radius:14px;font-size:.93rem;font-weight:700;color:#fff;cursor:pointer}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr" id="appHdr">
  <div class="hdr-bubble a"></div>
  <div class="hdr-bubble b"></div>
  <div class="brand">GYEONGGI CARE</div>
  <h1>🍱 경기케어<small>일 일 메 뉴</small></h1>
  <div class="today-chip" id="todayChip">📅 로딩 중…</div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="empty" id="emptyCard" style="display:none">
    <div class="ei">🥡</div>
    <p>아직 등록된 메뉴가 없습니다.<br>우측 하단 <b>🔒 관리자</b> 버튼을 눌러<br>엑셀 파일을 업로드해주세요.</p>
  </div>

  <!-- 날짜 네비게이터 -->
  <div class="date-nav" id="dateNav" style="display:none">
    <button class="nav-arrow" id="btnPrev" onclick="moveDate(-1)">‹</button>
    <div class="date-center">
      <div class="dc-lbl" id="dcLbl">오늘</div>
      <div class="dc-num" id="dcNum">11</div>
      <div class="dc-day" id="dcDay">토요일</div>
    </div>
    <button class="nav-arrow" id="btnNext" onclick="moveDate(1)">›</button>
  </div>

  <!-- 식사 선택 -->
  <div class="meal-row" id="mealRow" style="display:none">
    <div class="mbtn" onclick="pickMeal('아침',this)">
      <span class="mbtn-icon">🌅</span><span class="mbtn-lbl">아침</span>
    </div>
    <div class="mbtn" onclick="pickMeal('점심',this)">
      <span class="mbtn-icon">☀️</span><span class="mbtn-lbl">점심</span>
    </div>
    <div class="mbtn" onclick="pickMeal('저녁',this)">
      <span class="mbtn-icon">🌙</span><span class="mbtn-lbl">저녁</span>
    </div>
  </div>

  <!-- 메뉴 표시 -->
  <div class="menu-panel" id="menuPanel">
    <div class="menu-ttl" id="menuTtl"></div>
    <div class="menu-body" id="menuBody"></div>
  </div>
</div>

<!-- NOTIF FAB -->
<div class="notif-fab">
  <button id="notifBtn" onclick="toggleNotif()">🔕 알림 OFF</button>
</div>

<!-- ADMIN FAB -->
<div class="admin-fab">
  <button onclick="openPw()">🔒 관리자</button>
</div>

<!-- PASSWORD -->
<div class="ov" id="pwOv" onclick="if(event.target===this)closePw()">
  <div class="pw-box">
    <div class="pw-lock">🔐</div>
    <div class="pw-title">관리자 인증</div>
    <div class="pw-sub">비밀번호 4자리를 입력하세요</div>
    <div class="pw-dots">
      <div class="dot" id="d0"></div><div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div><div class="dot" id="d3"></div>
    </div>
    <div class="pw-err" id="pwErr"></div>
    <div class="numpad">
      <button class="npbtn" onclick="np('1')">1</button>
      <button class="npbtn" onclick="np('2')">2</button>
      <button class="npbtn" onclick="np('3')">3</button>
      <button class="npbtn" onclick="np('4')">4</button>
      <button class="npbtn" onclick="np('5')">5</button>
      <button class="npbtn" onclick="np('6')">6</button>
      <button class="npbtn" onclick="np('7')">7</button>
      <button class="npbtn" onclick="np('8')">8</button>
      <button class="npbtn" onclick="np('9')">9</button>
      <button class="npbtn emp"></button>
      <button class="npbtn" onclick="np('0')">0</button>
      <button class="npbtn del" onclick="npDel()">⌫</button>
    </div>
    <button class="pw-cancel" onclick="closePw()">취소</button>
  </div>
</div>

<!-- CHANGE PASSWORD -->
<div class="ov" id="cpOv" onclick="if(event.target===this)closeChangePw()">
  <div class="pw-box">
    <div class="pw-lock">🔑</div>
    <div class="pw-title" id="cpTitle">새 비밀번호 입력</div>
    <div class="pw-sub" id="cpSub">4자리를 입력하세요</div>
    <div class="pw-dots">
      <div class="dot" id="cp0"></div><div class="dot" id="cp1"></div>
      <div class="dot" id="cp2"></div><div class="dot" id="cp3"></div>
    </div>
    <div class="pw-err" id="cpErr"></div>
    <div class="numpad">
      <button class="npbtn" onclick="cpNp('1')">1</button>
      <button class="npbtn" onclick="cpNp('2')">2</button>
      <button class="npbtn" onclick="cpNp('3')">3</button>
      <button class="npbtn" onclick="cpNp('4')">4</button>
      <button class="npbtn" onclick="cpNp('5')">5</button>
      <button class="npbtn" onclick="cpNp('6')">6</button>
      <button class="npbtn" onclick="cpNp('7')">7</button>
      <button class="npbtn" onclick="cpNp('8')">8</button>
      <button class="npbtn" onclick="cpNp('9')">9</button>
      <button class="npbtn emp"></button>
      <button class="npbtn" onclick="cpNp('0')">0</button>
      <button class="npbtn del" onclick="cpDel()">⌫</button>
    </div>
    <button class="pw-cancel" onclick="closeChangePw()">취소</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="admin-panel" id="adminPanel">
  <div class="ap-inner">
    <div class="ap-head">
      <h2>⚙️ 관리자 패널</h2>
      <button class="ap-close" onclick="closeAdmin()">✕</button>
    </div>
    <div class="sec-lbl">📊 엑셀(xlsx) 메뉴 업로드</div>
    <label for="xlsxInput" class="upload-box">
      <div class="ub-icon">📊</div>
      <div class="ub-lbl">엑셀 파일을 선택하세요</div>
      <div class="ub-hint">.xlsx 형식 · 날짜/아침/점심/저녁 포함된 메뉴표</div>
    </label>
    <input type="file" id="xlsxInput" accept=".xlsx,.xls,.xlsm" onchange="onXlsx(event)" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"/>
    <div class="status-bar" id="statusBar"></div>
    <div class="sec-lbl" style="margin-top:6px">✏️ 텍스트 직접 편집</div>
    <div class="raw-hint">아래 형식으로 직접 입력하거나 엑셀 업로드 후 수정하세요.</div>
    <textarea class="raw-area" id="rawArea" placeholder="형식 예시:

2026-04-09
아침: 된장국, 밥, 김치, 달걀프라이
점심: 비빔밥, 미역국, 불고기, 깍두기
저녁: 삼겹살, 쌈채소, 된장찌개"></textarea>
    <button class="abtn pri" onclick="doSave()">💾 메뉴 저장하기</button>
    <button class="abtn sec" onclick="closeAdmin()">← 돌아가기</button>
    <button class="abtn sec" onclick="openChangePw()">🔑 비밀번호 변경</button>
    <button class="abtn dan" onclick="doReset()">🗑️ 전체 초기화</button>
  </div>
</div>

<script>
/* ── 상태 ── */
var menuData={}, curDate=null, pwStr='';

/* ── SHA-256 ── */
async function sha256(str){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

/* ── 날짜 ── */
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(s,n){var d=new Date(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtParts(s){var a=s.split('-');return{y:a[0],mo:+a[1],da:+a[2]};}
function fmtWday(s){return DAYS[new Date(s).getDay()]+'요일';}

/* ── 저장 ── */
var _lsOk=(function(){try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true;}catch(e){return false;}})();
function loadData(){
  // menu.json(서버 자동생성) 우선, 실패 시 localStorage 사용
  fetch('menu.json?_='+Date.now())
    .then(function(r){if(!r.ok)throw new Error('no menu.json');return r.json();})
    .then(function(data){
      // menu.json 데이터를 localStorage 위 데이터와 병합 (관리자 수동입력 유지)
      var local={};
      if(_lsOk){try{local=JSON.parse(localStorage.getItem('gkMenu')||'{}');}catch(e){}}
      // menu.json이 우선, local은 menu.json에 없는 날짜만 보충
      menuData=Object.assign({},local,data);
      render();
    })
    .catch(function(){
      if(_lsOk){try{menuData=JSON.parse(localStorage.getItem('gkMenu')||'{}');}catch(e){menuData={};}}
      render();
    });
}
function saveData(){
  if(_lsOk){try{localStorage.setItem('gkMenu',JSON.stringify(menuData));}catch(e){_lsOk=false;}}
}

/* ── 날짜 목록 & 인덱스 ── */
var navDates=[], navIdx=0;

/* ── 렌더 ── */
function render(){
  var t=todayStr();
  var candidates=[t,addDays(t,1),addDays(t,2),addDays(t,3),addDays(t,4),addDays(t,5)];

  var dateNav=document.getElementById('dateNav');
  var mealRow=document.getElementById('mealRow');
  var menuPanel=document.getElementById('menuPanel');
  var emptyCard=document.getElementById('emptyCard');

  var hasAny=candidates.some(function(d){return menuData[d]&&Object.keys(menuData[d]).length>0;});

  if(!hasAny){
    emptyCard.style.display='block';
    dateNav.style.display='none';
    mealRow.style.display='none';
    menuPanel.classList.remove('on');
    return;
  }

  navDates=candidates; // 오늘/내일/모레 항상 3개
  emptyCard.style.display='none';
  dateNav.style.display='';
  mealRow.style.display='';

  // 오늘(인덱스 0)에서 시작
  navIdx=0;
  updateDateDisplay(true);
}

/* ── 날짜 디스플레이 갱신 ── */
function updateDateDisplay(skipMeal){
  var d=navDates[navIdx];
  var p=fmtParts(d);
  var lbl=DATE_LABELS[String(navIdx)]||'';
  document.getElementById('dcLbl').textContent=lbl;
  document.getElementById('dcNum').textContent=p.da;
  document.getElementById('dcDay').textContent=fmtWday(d);
  document.getElementById('btnPrev').disabled=(navIdx===0);
  document.getElementById('btnNext').disabled=(navIdx===navDates.length-1);
  curDate=d;

  // 식사 버튼/메뉴 초기화
  var btns=document.querySelectorAll('.mbtn');
  for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');
  document.getElementById('menuPanel').classList.remove('on');

  if(!skipMeal){
    autoPickMeal(getMealByTime());
  }
}

/* ── 화살표 이동 ── */
function moveDate(dir){
  var next=navIdx+dir;
  if(next<0||next>=navDates.length)return;
  navIdx=next;
  gsap.fromTo('.date-center',{x:dir*30,opacity:0},{x:0,opacity:1,duration:.22,ease:'power2.out'});
  updateDateDisplay(false);
}

function autoPickMeal(meal){
  var btns=document.querySelectorAll('.mbtn');
  for(var i=0;i<btns.length;i++){
    if(btns[i].querySelector('.mbtn-lbl').textContent===meal){
      pickMeal(meal, btns[i]);break;
    }
  }
}

/* ── 식사 선택 ── */
function pickMeal(meal, btn){
  if(!curDate)return;
  var btns=document.querySelectorAll('.mbtn');
  for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');
  btn.classList.add('active');

  var items=(menuData[curDate]||{})[meal]||[];
  var ttl=document.getElementById('menuTtl');
  var body=document.getElementById('menuBody');
  var panel=document.getElementById('menuPanel');

  ttl.textContent=mealIcon(meal)+' '+meal+' 메뉴';
  if(!items.length){
    body.innerHTML='<div class="menu-none" style="grid-column:1/-1">😢 등록된 메뉴가 없어요</div>';
  } else {
    var h='';
    for(var i=0;i<items.length;i++){
      h+='<div class="mitem"><span class="mitem-em">'+getEmoji(items[i])+'</span><span class="mitem-nm">'+esc(items[i])+'</span></div>';
    }
    body.innerHTML=h;
  }
  panel.classList.add('on');
  gsap.fromTo('.mitem',{opacity:0,y:10},{opacity:1,y:0,duration:0.25,stagger:0.05,ease:'power2.out'});
}

/* ── 파싱 ── */
function parseTxt(text){
  var res={};var lines=text.split(/\r?\n/);var cur=null;
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;
    var d=findDate(line);if(d){cur=d;if(!res[cur])res[cur]={};continue;}
    if(!cur)continue;
    var meal=findMeal(line);
    if(meal){
      var rest=line.replace(/^(아침|조식|점심|중식|저녁|석식)/,'').replace(/^[\s:：]+/,'');
      if(!res[cur][meal])res[cur][meal]=[];
      var items=splitItems(rest);
      for(var j=0;j<items.length;j++)res[cur][meal].push(items[j]);
    }
  }
  return res;
}
function findDate(s){
  var m,yr=new Date().getFullYear();
  m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  m=s.match(/(\d{2})년\s*(\d{1,2})월\s*(\d{1,2})일/);if(m)return '20'+m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  m=s.match(/(\d{1,2})월\s*(\d{1,2})일/);if(m)return yr+'-'+pad(+m[1])+'-'+pad(+m[2]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})$/);if(m&&+m[1]<=12&&+m[2]<=31)return yr+'-'+pad(+m[1])+'-'+pad(+m[2]);
  return null;
}
function findMeal(s){
  if(/^(아침|조식)/.test(s))return'아침';
  if(/^(점심|중식)/.test(s))return'점심';
  if(/^(저녁|석식)/.test(s))return'저녁';
  return null;
}
function splitItems(s){
  if(!s.trim())return[];
  if(s.indexOf(',')>=0||s.indexOf('，')>=0)
    return s.split(/[,，]+/).map(function(x){return x.trim();}).filter(function(x){return x.length>0;});
  return s.split(/\s+/).map(function(x){return x.trim();}).filter(function(x){return x.length>=2;});
}

/* ── XLSX ── */
function xlSerialToDate(n){
  if(typeof n!=='number'||n<1)return null;
  var d=new Date(Math.round((n-25569)*86400*1000));
  if(isNaN(d.getTime()))return null;
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function findDateXl(cell){
  if(cell instanceof Date)return cell.getFullYear()+'-'+pad(cell.getMonth()+1)+'-'+pad(cell.getDate());
  var n=+cell;if(!isNaN(n)&&n>40000&&n<60000)return xlSerialToDate(n);
  var s=String(cell||'').trim();var d=findDate(s);if(d)return d;
  var yr=new Date().getFullYear();var m;
  m=s.match(/(\d{1,2})[\/\.](\d{1,2})/);
  if(m&&+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31)return yr+'-'+pad(+m[1])+'-'+pad(+m[2]);
  return null;
}
function onXlsx(e){
  var file=e.target.files[0];if(!file)return;
  setStatus('<span class="spin"></span> 엑셀 읽는 중…','info');
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var wb=XLSX.read(ev.target.result,{type:'array',cellDates:true,raw:false});
      var res={};var rawLines=[];
      for(var si=0;si<wb.SheetNames.length;si++){
        var ws=wb.Sheets[wb.SheetNames[si]];
        var rowsRaw=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,dateNF:'yyyy-mm-dd'});
        var rowsFmt=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
        parseXlsxRows(rowsRaw,rowsFmt,res,rawLines);
      }
      var cnt=Object.keys(res).length;
      if(rawLines.length)document.getElementById('rawArea').value=rawLines.join('\n');
      if(!cnt){setStatus('⚠️ 자동 파싱 실패 — 아래 텍스트를 확인 후 저장하세요.','err');return;}
      for(var k in res)menuData[k]=res[k];
      saveData();render();
      setStatus('✅ 엑셀 로드 완료 ('+cnt+'일치 저장)','ok');
    }catch(err){setStatus('❌ 엑셀 오류: '+esc(err.message),'err');}
    e.target.value='';
  };
  reader.readAsArrayBuffer(file);
}
function parseXlsxRows(rowsRaw,rowsFmt,res,rawLines){
  var dateRowIdx=-1,dateCols={},mealCol=0;
  for(var r=0;r<rowsFmt.length;r++){
    var row=rowsFmt[r];var found=0;var tmp={};
    for(var c=0;c<row.length;c++){
      var d=findDateXl(rowsRaw[r]?rowsRaw[r][c]:'')||findDateXl(row[c]);
      if(d){tmp[c]=d;found++;}
    }
    if(found>=2){
      dateRowIdx=r;dateCols=tmp;
      var minCol=Math.min.apply(null,Object.keys(tmp).map(Number));
      mealCol=Math.max(0,minCol-1);break;
    }
  }
  if(dateRowIdx>=0){
    var curMeal=null;
    for(var r2=dateRowIdx+1;r2<rowsFmt.length;r2++){
      var row2=rowsFmt[r2];
      var mealCell=String(row2[mealCol]||'').trim();
      if(/조식|아침/.test(mealCell))curMeal='아침';
      else if(/중식|점심/.test(mealCell))curMeal='점심';
      else if(/석식|저녁/.test(mealCell))curMeal='저녁';
      if(!curMeal)continue;
      for(var c2 in dateCols){
        var dt2=dateCols[c2];var cell2=String(row2[c2]||'').trim();if(!cell2)continue;
        if(!res[dt2])res[dt2]={};if(!res[dt2][curMeal])res[dt2][curMeal]=[];
        var its=cell2.split(/[,\n]+/).map(function(x){return x.trim();}).filter(function(x){return x.length>=1;});
        for(var j=0;j<its.length;j++)res[dt2][curMeal].push(its[j]);
      }
    }
    var dates2=Object.keys(res).sort();
    for(var di=0;di<dates2.length;di++){
      rawLines.push(dates2[di]);
      var ms=['아침','점심','저녁'];
      for(var mi=0;mi<ms.length;mi++){var its2=(res[dates2[di]][ms[mi]]||[]);if(its2.length)rawLines.push(ms[mi]+': '+its2.join(', '));}
      rawLines.push('');
    }
    return;
  }
  var cur=null;
  for(var r3=0;r3<rowsFmt.length;r3++){
    var line=rowsFmt[r3].map(function(x){return String(x||'').trim();}).filter(function(x){return x;}).join(' ');
    rawLines.push(line);if(!line)continue;
    var d2=findDateXl(line)||findDate(line);
    if(d2){cur=d2;if(!res[cur])res[cur]={};continue;}
    if(!cur)continue;
    var meal2=findMeal(line);
    if(meal2){
      var rest=line.replace(/^(아침|조식|점심|중식|저녁|석식)/,'').replace(/^[\s:：]+/,'');
      if(!res[cur][meal2])res[cur][meal2]=[];
      var its3=splitItems(rest);
      for(var j3=0;j3<its3.length;j3++)if(its3[j3])res[cur][meal2].push(its3[j3]);
    }
  }
}


/* ── 시간대 식사 판별 ── */
// 아침 00:01~07:30 / 점심 07:31~12:30 / 저녁 12:31~자정
function getMealByTime(){
  var now=new Date();
  var m=now.getHours()*60+now.getMinutes();
  if(m<=450)return'아침';   // 7*60+30
  if(m<=750)return'점심';   // 12*60+30
  return'저녁';
}

/* ── 푸시 알림 ── */
var NOTIF_TIMES=[
  {meal:'아침',h:0,m:1},
  {meal:'점심',h:7,m:31},
  {meal:'저녁',h:12,m:31}
];
var notifTimers=[];

function notifEnabled(){return localStorage.getItem('gkNotif')==='1';}

function scheduleNotifs(){
  notifTimers.forEach(clearTimeout);notifTimers=[];
  if(!notifEnabled()||Notification.permission!=='granted')return;
  var now=new Date();
  NOTIF_TIMES.forEach(function(nt){
    var target=new Date(now.getFullYear(),now.getMonth(),now.getDate(),nt.h,nt.m,0,0);
    if(target<=now)target.setDate(target.getDate()+1);
    var delay=target-now;
    notifTimers.push(setTimeout(function(){
      fireNotif(nt.meal);
      setTimeout(scheduleNotifs,5000);
    },delay));
  });
}

function fireNotif(meal){
  var today=todayStr();
  var items=(menuData[today]||{})[meal]||[];
  var icon=mealIcon(meal);
  var body=items.length?items.slice(0,4).join(', '):'오늘의 메뉴를 확인하세요.';
  try{
    new Notification(icon+' '+meal+' 메뉴 안내',{
      body:body,
      icon:'https://raw.githubusercontent.com/jointuplt2-wq/daily-menu/master/icon-512.png',
      badge:'https://raw.githubusercontent.com/jointuplt2-wq/daily-menu/master/favicon-32.png',
      tag:'meal-'+meal
    });
  }catch(e){}
}

function toggleNotif(){
  if(!('Notification'in window)){showPopup('err','미지원','이 브라우저는 알림을 지원하지 않습니다.');return;}
  if(notifEnabled()){
    localStorage.setItem('gkNotif','0');
    notifTimers.forEach(clearTimeout);notifTimers=[];
    updateNotifBtn();return;
  }
  if(Notification.permission==='denied'){showPopup('err','알림 차단됨','브라우저 설정에서 이 사이트의 알림을 허용해주세요.');return;}
  Notification.requestPermission().then(function(perm){
    if(perm==='granted'){
      localStorage.setItem('gkNotif','1');
      scheduleNotifs();
      updateNotifBtn();
      showPopup('ok','알림 설정 완료! 🔔','아침(00:01), 점심(07:31), 저녁(12:31)에\n오늘의 메뉴를 알려드릴게요.');
    }else{
      showPopup('err','알림 거부됨','알림 권한이 거부되었습니다.');
    }
  });
}

function updateNotifBtn(){
  var btn=document.getElementById('notifBtn');if(!btn)return;
  var on=notifEnabled()&&Notification.permission==='granted';
  btn.textContent=on?'🔔 알림 ON':'🔕 알림 OFF';
  btn.className=on?'on':'';
}

/* ── 초기화 ── */
(function(){
  var now=new Date();
  document.getElementById('todayChip').textContent='📅 '+now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+DAYS[now.getDay()]+'요일';
  gsap.fromTo('.brand',{y:-10,opacity:0},{y:0,opacity:1,duration:.45,ease:'power2.out'});
  gsap.fromTo('#appHdr h1',{y:-20,opacity:0},{y:0,opacity:1,duration:.6,delay:.08,ease:'power3.out'});
  gsap.fromTo('.today-chip',{scale:.8,opacity:0},{scale:1,opacity:1,duration:.5,delay:.2,ease:'back.out(1.7)'});
  loadData();
  // 오늘 데이터 있으면 현재 시간대 식사 자동 선택
  setTimeout(function(){
    if(navDates.length&&menuData[navDates[0]]){
      autoPickMeal(getMealByTime());
    }
  },400);
  // 알림 초기화
  updateNotifBtn();
  if(notifEnabled()&&Notification.permission==='granted')scheduleNotifs();
})();
</script>
